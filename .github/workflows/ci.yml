name: CI

# Esteira de integracao do portal. Roda a cada push nas branches de trabalho e em
# todo PR para a main. Pega regressao de tipo, quebra de build e CVE de severidade
# alta/critica antes do deploy (o portal e self-hosted na Railway, sem o filtro de
# borda da Vercel/Netlify, entao a esteira aqui e a rede de seguranca). [audit 2026-06-28]

on:
  push:
    branches: [main, portal-backend]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portal:
    name: Portal (typecheck, testes, build, audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: portal
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: portal/package-lock.json
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      # Testes unitarios das funcoes puras (node:test via tsx, sem banco e sem servidor).
      # Rodam aqui porque teste que a esteira nao executa e teste que ninguem executa.
      - name: Testes unitarios
        run: npm run test:unit
      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          # Dummy: o build nao conecta no banco (rotas sao dinamicas e assertProdEnv e
          # pulado na fase de build), mas garante o formato caso algo leia a env no build.
          DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci"
      # O audit que bloqueia olha só a árvore de produção, que é o que roda no Railway.
      # As ferramentas de build entram no audit completo logo abaixo, que avisa sem
      # derrubar o job. Motivo (10/2026): o braces GHSA-vfj7-8cjw-p6xm, alto e sem versão
      # corrigida publicada, só entra pelo Tailwind 3 e deixava todo PR vermelho. Quando
      # sair a correção, volte o audit completo a bloquear.
      - name: Audit de produção (falha em high/critical)
        run: npm audit --omit=dev --audit-level=high
      - name: Audit completo, com dependências de build (só avisa)
        run: |
          if ! npm audit --audit-level=high; then
            echo "::warning title=npm audit completo::Vulnerabilidade alta ou crítica em dependência de build. Detalhes no log deste passo."
          fi

  # Site institucional estatico (raiz do repo). As dependencias ficam so em
  # tests/site/ e nunca vao para o ar: o Netlify publica apenas o que o cp do
  # netlify.toml copia. Os testes de navegador rodam sobre o build simulado.
  site:
    name: Site (parciais, lint, tipos, testes, navegador)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: tests/site/package-lock.json
      - name: Parciais e versoes de cache em dia
        run: node dev/site/build.mjs --check
      - name: Lint do HTML
        run: node dev/site/lint.mjs
      - name: Instalar ferramentas de teste
        run: npm ci --prefix tests/site
      - name: Typecheck
        run: npm --prefix tests/site run typecheck
      - name: Testes unitarios
        run: npm --prefix tests/site run test:unit
      - name: Build simulado do Netlify
        run: node dev/site/build.mjs --dist .tmp-site
      - name: Navegador do Playwright
        working-directory: tests/site
        run: npx playwright install --with-deps chromium
      - name: Testes de navegador
        working-directory: tests/site
        run: npx playwright test
        env:
          SITE_RAIZ: .tmp-site
      - name: Relatorio do Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tests/site/playwright-report
          retention-days: 7

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          # Exigido pela action para escanear PRs (mudanca recente do gitleaks-action).
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
