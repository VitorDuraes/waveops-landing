# waveops.com.br = LANDING ESTATICA. O portal (checkout, /cliente, /admin, /api,
# /termos, /privacidade) vive em portal.waveops.com.br (Railway), com banco e
# Mercado Pago unicos. Aqui NAO se roda o Next: publicamos so a landing.
#
# Decisao 2026-06-27: consolidar tudo no Railway. Antes, Netlify e Railway rodavam
# o portal EM PARALELO, com bancos diferentes: o cliente assinava em waveops.com.br
# (banco do Netlify) e o webhook do MP batia em portal.waveops.com.br (banco do
# Railway), entao a fatura nunca baixava. Agora ha UM portal e UM banco.

[build]
  # O base directory do site no Netlify esta travado em "portal" (config da UI),
  # entao o build roda dentro de portal/. A landing (index.html, assets/, robots,
  # sitemap) fica na RAIZ do repo, um nivel acima: por isso copiamos de "../".
  # Monta um site estatico so com a landing (nao serve o codigo-fonte do repo).
  command = "rm -rf _site && mkdir -p _site && cp ../index.html ../robots.txt ../sitemap.xml ../llms.txt _site/ && cp -r ../assets _site/"
  publish = "_site"

  # O Netlify ignora o build quando nada muda dentro do base directory, que aqui
  # e portal/. Como a landing mora na RAIZ, um commit que mexe so no index.html
  # ou em assets/ nao dispararia deploy nenhum: ia ao ar de carona, quando outro
  # commit tocasse portal/ ou netlify.toml.
  #
  # O contrato do ignore e invertido: exit 0 IGNORA o build, exit diferente de 0
  # BUILDA. `git diff --quiet` sai 0 quando nao ha diferenca, entao ignorar
  # acontece exatamente quando nenhum arquivo publicado mudou. O comando roda a
  # partir do base directory, por isso os "../".
  #
  # O "." no fim e o proprio portal/, que nao muda o que e publicado mas fica na
  # regra de proposito: hoje um commit nele dispara build, e esta regra so
  # ACRESCENTA a landing. Nada passa a deployar menos do que ja deploya. E se o
  # comando quebrar, o exit vira diferente de 0 e o Netlify builda: a falha erra
  # para o lado de publicar demais, nunca para o lado de congelar a landing.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- ../index.html ../assets ../robots.txt ../sitemap.xml ../llms.txt ../netlify.toml ."

# Rede de seguranca: qualquer rota de portal que caia aqui (bookmark antigo, link
# indexado, URL digitada) salta pro Railway, pra nunca existir um 2o portal/banco
# em waveops.com.br. Os botoes da landing ja apontam direto pro portal (absolutos).
[[redirects]]
  from = "/cliente/*"
  to = "https://portal.waveops.com.br/cliente/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/admin/*"
  to = "https://portal.waveops.com.br/admin/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/checkout"
  to = "https://portal.waveops.com.br/checkout"
  status = 301
  force = true

[[redirects]]
  from = "/api/*"
  to = "https://portal.waveops.com.br/api/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/termos"
  to = "https://portal.waveops.com.br/termos"
  status = 301
  force = true

[[redirects]]
  from = "/privacidade"
  to = "https://portal.waveops.com.br/privacidade"
  status = 301
  force = true

# Headers de seguranca. A politica principal de CSP continua na <meta> do
# index.html, e NAO e duplicada aqui: duas politicas valem ao mesmo tempo e o
# navegador aplica a intersecao, entao duplicar so cria chance de divergir.
#
# O que entra aqui e o que a <meta> nao consegue fazer. frame-ancestors so vale
# como header HTTP, e e por isso que a protecao contra clickjacking ficou aberta
# enquanto o site esteve no GitHub Pages. Esta segunda politica declara SO
# frame-ancestors: diretiva ausente nao restringe nada, entao ela nao mexe em
# script-src, img-src nem no resto da <meta>.
#
# Strict-Transport-Security fica de fora de proposito. O Netlify ja manda
# max-age=31536000, e acrescentar includeSubDomains alcancaria
# portal.waveops.com.br no Railway. Isso e decisao de infra, nao de landing.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "frame-ancestors 'none'"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
